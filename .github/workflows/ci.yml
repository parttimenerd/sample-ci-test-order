name: CI

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [plugin-updated]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for git diff

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: sapmachine
          java-version: '17'
          cache: maven

      - name: Restore test-order index
        uses: actions/cache@v4
        with:
          path: .test-order/
          key: test-order-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            test-order-refs/heads/main-
            test-order-

      # ── Learn mode on main (builds the full dependency index) ──
      - name: "Learn: full instrumented run"
        if: github.ref == 'refs/heads/main'
        run: mvn -B -ntp test -Dtestorder.mode=learn

      # ── Affected-first on PRs ──
      - name: Run affected tests
        if: github.ref != 'refs/heads/main'
        run: |
          mvn -B -ntp test-order:affected test \
            -Dtestorder.changeMode=since-last-commit

      - name: Run remaining tests (if affected passed)
        if: github.ref != 'refs/heads/main'
        run: mvn -B -ntp test-order:run-remaining test

      - name: Save test-order index
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .test-order/
          key: test-order-${{ github.ref }}-${{ github.sha }}

      - name: Upload dependency index
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-order-deps
          path: .test-order/test-dependencies.lz4
          retention-days: 90
          if-no-files-found: warn
